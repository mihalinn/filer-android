name: 要望 / Feature request
description: こんな機能がほしい、ここをこう変えたい、などを書いてください / Tell us about a feature you would like or something you would like changed
title: "[要望 / Request] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        要望ありがとうございます。日本語でも英語でもかまいません。実現できるかは約束できませんが、読んで検討します。
        **個人情報は書かないでください**。この内容は誰でも読めます。

        Thank you for your request. Please write in Japanese or English. I cannot promise it will be done, but I will read it and consider it.
        **Do not include personal information.** Anyone can read this issue.
  - type: textarea
    id: want
    attributes:
      label: どんなことをしたいですか / What do you want to do?
      description: 困っていること、やりたいことを書いてください。 / Describe the problem you have or what you want to do.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: こうなっていたら嬉しい、という案 / How would you like it to work?
      description: 画面のイメージや、ほかのアプリの例があれば書いてください。 / If you have a sketch of the screen or an example from another app, please add it.
  - type: input
    id: version
    attributes:
      label: アプリのバージョン / App version
      description: 設定の「アプリの更新」に表示されています。 / Shown in Settings under “App updates”.
      placeholder: "例 / e.g. 0.62.1"
